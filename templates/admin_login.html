{% extends "base.html" %}
{% block titre %}Connexion Admin - {{ app_name }}{% endblock %}

{% block contenu %}
<main class="flex-1 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-sm w-full space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-50 text-france-blue rounded-2xl mx-auto flex items-center justify-center text-2xl">
        <i class="fa-solid fa-lock" aria-hidden="true"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-900">Espace Admin</h1>
      <p class="text-sm text-slate-500">Connectez-vous pour gérer la base de questions.</p>
    </div>
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="mot_de_passe" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required autofocus
               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-france-blue text-sm">
      </div>
      <button type="submit" class="w-full bg-france-blue hover:bg-blue-800 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition">
        Se connecter
      </button>
    </form>
    <a href="{{ url_for('accueil') }}" class="block text-center text-xs text-slate-400 hover:text-slate-600">&larr; Retour à l'application</a>
  </div>
</main>
{% endblock %}
